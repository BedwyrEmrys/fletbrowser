name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置与锁文件要求一致的 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. 设置 Java 环境（Android 打包必需）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 设置 Flutter SDK 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # 5. 设置 Astral uv 工具
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # 6. 使用锁文件安装依赖
      - name: Install Dependencies with uv
        run: uv sync --locked

      # 7. 执行 Flet 构建 APK 命令
      - name: Build APK
        run: uv run --locked flet build apk

      # 8. 上传生成的 APK 文件到 GitHub Actions 产物中
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk-release
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error