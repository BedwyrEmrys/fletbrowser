[project]
name = "fletbrowser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bedwyr", email = "bedwyr" }
]
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.2",
    "flet-webview>=1.1.2",
]

[project.scripts]
fletbrowser = "fletbrowser:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
]
